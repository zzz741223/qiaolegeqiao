name: Build Windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to receive the installer
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: |
          npm test
          npm run lint

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: qiaolegeqiao-windows-${{ github.ref_name }}
          path: release/*.exe
          if-no-files-found: error

      - name: Attach installer to GitHub release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: pwsh
        run: |
          gh release view "$env:RELEASE_TAG" --json tagName | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:RELEASE_TAG" --generate-notes
          }
          gh release upload "$env:RELEASE_TAG" release/*.exe --clobber
